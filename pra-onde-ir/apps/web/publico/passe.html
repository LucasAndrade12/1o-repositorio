<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e4f5e">
<meta name="robots" content="noindex, nofollow">
<title>Passe de encaminhamento — Pra Onde Ir</title>
<link rel="stylesheet" href="/estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e4f5e'/><text y='68' x='50' text-anchor='middle' font-size='52' fill='white' font-family='sans-serif' font-weight='bold'>PO</text></svg>">
</head>
<body>

<header class="topo">
  <div class="topo-conteudo">
    <div class="marca">
      <span class="marca-sigla" aria-hidden="true">PO</span>
      <span>Passe de encaminhamento</span>
    </div>
  </div>
</header>

<main class="pagina" id="conteudo">
  <!-- C1 — o código sozinho não abre nada. Segundo fator obrigatório. -->
  <div class="cartao" id="pedir-pin">
    <div class="cartao-titulo">Passe protegido</div>
    <h1 style="font-size:1.5rem;margin-bottom:.5rem">Digite o PIN</h1>
    <p class="mini" style="margin-bottom:1.2rem">
      O código de exibição sozinho não abre este documento. É preciso o PIN de 4 dígitos
      escolhido no momento da triagem, ou o link completo do QR Code.
    </p>
    <form id="form-pin">
      <input type="text" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" required
             placeholder="••••" aria-label="PIN de 4 dígitos"
             style="text-align:center;letter-spacing:.5em;font-size:1.9rem;font-weight:700">
      <button class="botao" type="submit" style="margin-top:1rem">Abrir passe</button>
    </form>
    <p class="mini" id="erro" style="color:var(--vermelho);margin-top:.9rem"></p>
  </div>

  <div id="passe" class="oculto"></div>
</main>

<script src="/passe.js"></script>
</body>
</html>
